; Сборка прошивки для платы (docs/firmware-plan.md, Ф3). Ядро — lib/core (то же, что в сборке для ПК через CMake), драйверы
; платы — src/esp32. Сборка: pio run -e crowpanel579; прошивка: pio run -e crowpanel579 -t upload; журнал: pio device monitor.
;
; Панель висит горизонтально: кадр 792×272, поворот 0 (2 — если закреплена вверх ногами); кадр выше, чем шире, — портрет
; (+90°, main.cpp EpdPanel::orient).
;
; Выводы панели и кнопок — по примерам Elecrow для CrowPanel 5.79″ (сверить со схемой, когда плата будет в руках); выводы
; подсветки и делителя батареи зависят от нашей доработки платы и пока не заданы (-1 — выключено).

[platformio]
default_envs = crowpanel579

[env]
platform = espressif32@^6.9.0
framework = arduino
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
build_src_filter = +<esp32/>
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DMB10_FW_VERSION=\"0.1.0\"
  -DMB10_EPD_POWER=7
  -DMB10_EPD_CS=45
  -DMB10_EPD_DC=46
  -DMB10_EPD_RST=47
  -DMB10_EPD_BUSY=48
  -DMB10_EPD_SCK=12
  -DMB10_EPD_MOSI=11
  -DMB10_PANEL_ROTATION=0
  -DMB10_BUTTON_PIN=2
  -DMB10_BACKLIGHT_PIN=-1
  -DMB10_BATTERY_ADC_PIN=-1
  -DMB10_BATTERY_DIVIDER=2
lib_deps =
  zinggjm/GxEPD2@^1.6.0
  adafruit/Adafruit GFX Library@^1.11.9
  adafruit/Adafruit BusIO@^1.16.1
  bblanchon/ArduinoJson@^7.2.0

[env:crowpanel579]

; Для эмулятора Wokwi (Ф4): панели 5.79″ в Wokwi нет — вместо GxEPD2 заглушка, которая пишет в журнал CRC кадра; вшитая
; конфигурация (Wokwi-GUEST) и самопроверка изнутри платы (lib/selftest) — wokwi.toml, docs/firmware-plan.md.
[env:crowpanel579-wokwi]
build_flags =
  ${env.build_flags}
  -DMB10_PANEL_STUB
  -DMB10_SELFTEST
