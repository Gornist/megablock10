; Сборка прошивки для платы (docs/firmware-plan.md, Ф3). Ядро — lib/core (то же, что в сборке для ПК через CMake), драйверы
; платы — src/esp32. Сборка: pio run -e crowpanel579; прошивка: pio run -e crowpanel579 -t upload; журнал: pio device monitor.
;
; Панель висит горизонтально: кадр 792×272, поворот 0 (2 — если закреплена вверх ногами); кадр выше, чем шире, — портрет
; (+90°, main.cpp EpdPanel::orient).
;
; Выводы панели и кнопок сверены со схемой Elecrow (Eagle, Elecrow-RD/CrowPanel-ESP32-5.79-E-paper-HMI-Display-with-272-792):
; питание e-paper 7 (NMOS в земле панели, HIGH — включено), CS 45, DC 46, RST 47, BUSY 48, SCK 12, MOSI 11, MENU 2. Делителя
; батареи на плате нет: заряд — топливомер MAX17048 на I²C SDA 8 / SCL 9 (доработка; нет модуля — не шлётся); запасной
; вариант — делитель 1:1 на вывод 8: MB10_BATTERY_ADC_PIN=8 и MB10_I2C_SDA=-1 (без топливомера). Подсветка — наша
; доработка, пока -1. Свободное на гребёнке и microSD — docs/sound-nodes.md.

[platformio]
default_envs = crowpanel579

[env]
platform = espressif32@^6.9.0
framework = arduino
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
build_src_filter = +<esp32/>
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DMB10_FW_VERSION=\"0.1.0\"
  -DMB10_EPD_POWER=7
  -DMB10_EPD_CS=45
  -DMB10_EPD_DC=46
  -DMB10_EPD_RST=47
  -DMB10_EPD_BUSY=48
  -DMB10_EPD_SCK=12
  -DMB10_EPD_MOSI=11
  -DMB10_PANEL_ROTATION=0
  -DMB10_BUTTON_PIN=2
  -DMB10_BACKLIGHT_PIN=-1
  -DMB10_I2C_SDA=8
  -DMB10_I2C_SCL=9
  -DMB10_BATTERY_ADC_PIN=-1
  -DMB10_BATTERY_DIVIDER=2
  ; Звук (docs/sound-nodes.md): microSD на CrowPanel (свой SPI, питание 42), MAX98357A на гребёнке.
  -DMB10_SD_CS=10
  -DMB10_SD_MOSI=40
  -DMB10_SD_CLK=39
  -DMB10_SD_MISO=13
  -DMB10_SD_POWER=42
  -DMB10_I2S_BCLK=15
  -DMB10_I2S_LRCK=16
  -DMB10_I2S_DIN=17
  -DMB10_AMP_SD_MODE=18
lib_deps =
  zinggjm/GxEPD2@^1.6.0
  adafruit/Adafruit GFX Library@^1.11.9
  adafruit/Adafruit BusIO@^1.16.1
  bblanchon/ArduinoJson@^7.2.0
  ; 1.9.9 — последняя для Arduino-ESP32 2.x (2.x требует ядро 3); берём из неё только декодер MP3.
  earlephilhower/ESP8266Audio@1.9.9

[env:crowpanel579]

; Для эмулятора Wokwi (Ф4): панели 5.79″ в Wokwi нет — вместо GxEPD2 заглушка, которая пишет в журнал CRC кадра; вшитая
; конфигурация (Wokwi-GUEST) и самопроверка изнутри платы (lib/selftest) — wokwi.toml, docs/firmware-plan.md.
[env:crowpanel579-wokwi]
build_flags =
  ${env.build_flags}
  -DMB10_PANEL_STUB
  -DMB10_AUDIO_STUB
  -DMB10_SELFTEST

; Для эмулятора Espressif esp-emulator (esp-emu): то же, что crowpanel579-wokwi (вшитая сеть Wokwi-GUEST — эмулятор поднимает
; точку с этим именем, tools/espemu_selftest.sh), плюс поправка на сброс: программный сброс S3 эмулятор доводит до сторожа RTC
; (ESP_RST_WDT) — selftest_task.cpp. microSD в эмуляторе нет — звук проверяется без карты.
[env:crowpanel579-espemu]
build_flags =
  ${env:crowpanel579-wokwi.build_flags}
  -DMB10_SELFTEST_ESPEMU
