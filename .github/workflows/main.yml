name: Build debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]   # ветки агентов (agent/*) проверяются в PR до слияния
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6   # версия Gradle — из gradle/wrapper (та же, что локально)

      - name: Статический анализ Kotlin (detekt; kit — ещё и API Android 8.0 через Animal Sniffer)
        run: ./gradlew :app:detekt :kit:detekt :kit:animalsnifferMain --no-daemon

      - name: Отчёт detekt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-report
          path: |
            app/build/reports/detekt
            kit/build/reports/detekt
            kit/build/reports/animalsniffer
          if-no-files-found: ignore

      - name: Run unit tests
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          ./gradlew testDebugUnitTest :kit:test --no-daemon

      - name: Скриншот-тесты (Paparazzi, JVM)
        run: ./gradlew verifyPaparazziDebug --no-daemon

      - name: Отчёт скриншот-тестов (при падении)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: paparazzi-diff
          path: app/build/paparazzi/failures
          if-no-files-found: ignore

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: megablok10-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Server — тесты и сборка
        working-directory: admin-web/server
        run: |
          npm ci
          npm test
          npm run build

      - name: Сценарии-провокаторы детекторов аномалий (отдельный сервер, без эмуляторов)
        run: scripts/e2e/anomaly-all.sh

      - name: Артефакты replay детекторов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anomaly-replay
          path: /tmp/mb10-e2e-anom-artifacts
          if-no-files-found: ignore

      - name: Client — линт и сборка
        working-directory: admin-web/client
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
