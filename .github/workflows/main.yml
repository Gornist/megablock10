name: Build debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Run unit tests
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          gradle testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: megablok10-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Server — тесты и сборка
        working-directory: admin-web/server
        run: |
          npm ci
          npm test
          npm run build

      - name: Client — линт и сборка
        working-directory: admin-web/client
        run: |
          npm ci
          npm run lint
          npm run build
