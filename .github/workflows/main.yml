name: Build debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]   # ветки агентов (agent/*) проверяются в PR до слияния
  workflow_dispatch:
    inputs:
      record_screenshots:
        description: "Перезаписать эталоны скриншотов (Paparazzi) и закоммитить их в эту ветку — после намеренной правки интерфейса или обновления Compose/Paparazzi, когда снять локально нечем (облако без SDK). Эталоны потом просмотреть глазами."
        type: boolean
        default: false

# Новый пуш в тот же PR отменяет недоигранный прогон старого коммита (06.10: ci-wait ждал прогоны, которые никто не читал).
# Push в main и ручные запуски — группа по run_id, не отменяются.
concurrency:
  group: main-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # только для record_screenshots: коммит новых эталонов в ветку запуска
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"   # Paparazzi 2 требует Java 21 для сборки; байткод приложения — 17 (app/build.gradle.kts)

      - uses: gradle/actions/setup-gradle@v6   # версия Gradle — из gradle/wrapper (та же, что локально)

      - name: Статический анализ Kotlin (detekt; kit — ещё и API Android 8.0 через Animal Sniffer; Мост «Сети» — на мини-ПК, Animal Sniffer не нужен)
        run: ./gradlew :app:detekt :kit:detekt :rules:detekt :netrun-bridge:detekt :kit:animalsnifferMain :rules:animalsnifferMain --no-daemon

      - name: Отчёт detekt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-report
          path: |
            app/build/reports/detekt
            kit/build/reports/detekt
            kit/build/reports/animalsniffer
            rules/build/reports/detekt
            rules/build/reports/animalsniffer
            netrun-bridge/build/reports/detekt
          if-no-files-found: ignore

      # Все тесты приложения, кроме скриншотов (у тех своя JVM и свой шаг ниже). Раньше здесь был testDebugUnitTest, и шаг скриншотов
      # (verifyPaparazziDebug) гонял те же тесты второй раз; задача без скриншотов во втором вызове up-to-date (app/build.gradle.kts).
      - name: Run unit tests
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          ./gradlew testDebugUnitTestNoScreenshots :kit:test :rules:test :netrun-bridge:test --no-daemon

      # Room заново пишет схему в app/schemas при каждой сборке. Отличие от закоммиченной — схему забыли закоммитить или правили руками:
      # миграции и MigrationDataTest опираются на закоммиченную, а не на настоящую. Настоящая печатается прямо в журнал.
      - name: Схема Room совпадает с закоммиченной (app/schemas)
        if: always()
        run: |
          drift=$(git status --porcelain app/schemas)
          [ -z "$drift" ] && exit 0
          echo "$drift"; git diff app/schemas
          echo "$drift" | awk '$1=="??"{print $2}' | xargs -r cat
          echo "::error::Схема Room отличается от закоммиченной — см. вывод выше"; exit 1

      # kit проверяет Animal Sniffer (шаг выше), приложение — Android Lint (полный набор, baseline — app/lint-baseline.xml, как у detekt).
      - name: Android Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Отчёт Android Lint (при падении)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Эталоны скриншотов заново (только по кнопке record_screenshots)
        if: inputs.record_screenshots
        run: |
          # Старые файлы — прочь: при смене имён у Paparazzi устаревшие эталоны остались бы лежать.
          git rm -q -r --ignore-unmatch app/src/test/snapshots/images
          ./gradlew recordPaparazziDebug --no-daemon
          git add -A app/src/test/snapshots
          if git diff --cached --quiet; then echo "эталоны не изменились"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Скриншоты: эталоны перезаписаны в CI (record_screenshots, запуск ${{ github.run_id }})" \
                      -m "Снято recordPaparazziDebug на ${{ github.sha }} по кнопке в main.yml — облачная сессия без Android SDK снять их не может. Эталоны просмотреть глазами до слияния в main."
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Скриншот-тесты (Paparazzi, JVM)
        run: ./gradlew verifyPaparazziDebug --no-daemon

      - name: Отчёт скриншот-тестов (при падении)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: paparazzi-diff
          path: app/build/paparazzi/failures
          if-no-files-found: ignore

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: megablok10-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Server — тесты и сборка
        working-directory: admin-web/server
        run: |
          npm ci
          npm test
          npm run build

      - name: Сценарии-провокаторы детекторов аномалий (отдельный сервер, без эмуляторов)
        run: scripts/e2e/anomaly-all.sh

      - name: Артефакты replay детекторов
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: anomaly-replay
          path: /tmp/mb10-e2e-anom-artifacts
          if-no-files-found: ignore

      - name: Client — линт и сборка
        working-directory: admin-web/client
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
