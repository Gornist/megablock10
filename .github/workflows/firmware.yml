name: Прошивка QR-дисплея

# docs/firmware-plan.md: ядро и сборка для ПК проверяются настоящим сервером мастера (Ф1–Ф2), сборка для платы — компиляцией (Ф3)
# и самопроверкой изнутри платы в эмуляторе Wokwi (Ф4).
on:
  push:
    # Ветки агентов — тоже: workflow_dispatch работает только для workflow, который уже есть в main.
    branches: [ main, "claude/**", "agent/**" ]
    paths: [ "firmware/**", "admin-web/server/src/displays/**", "admin-web/server/src/audio/**", "admin-web/server/src/routes/audio.ts", "admin-web/server/src/scripts/display*.ts", ".github/workflows/firmware.yml" ]
  pull_request:
    branches: [ main ]
    paths: [ "firmware/**", "admin-web/server/src/displays/**", "admin-web/server/src/audio/**", "admin-web/server/src/routes/audio.ts", "admin-web/server/src/scripts/display*.ts", ".github/workflows/firmware.yml" ]
  workflow_dispatch: {}

jobs:
  host:
    name: Ядро и прошивка для ПК
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Сборка (CMake) и тесты ядра — общие векторы протокола, сессия, восстановление
        working-directory: firmware/display
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build -j
          ctest --test-dir build --output-on-failure

      - name: Ядро, прошивка для ПК и самопроверка под ASan/UBSan
        working-directory: firmware/display
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build-asan -j
          ctest --test-dir build-asan --output-on-failure

      - name: Сервер мастера ↔ прошивка для ПК — набор совместимости C1–C20 и сбои
        working-directory: admin-web/server
        env:
          FIRMWARE_HOST_BIN: ${{ github.workspace }}/firmware/display/build/display_host
        run: |
          npm ci
          npx tsx --test src/displayVectors.test.ts src/displayConformance.test.ts src/firmwareHost.test.ts

      # Ф6: групповая отправка на 1/5/10/30 прошивок для ПК, лимит соединений, зависший дисплей (SIGSTOP).
      - name: Нагрузка — 30 дисплеев и зависший
        working-directory: admin-web/server
        env:
          FIRMWARE_HOST_BIN: ${{ github.workspace }}/firmware/display/build/display_host
        run: npm run display-load -- --json load-clean.json

      # Плохой Wi-Fi на площадке: задержка и потери на lo (tc netem). Умеренный — должен проходить с таймаутами по умолчанию.
      - name: Нагрузка по плохой сети — 80±20 мс, потери 3 %
        working-directory: admin-web/server
        env:
          FIRMWARE_HOST_BIN: ${{ github.workspace }}/firmware/display/build/display_host
        run: |
          sudo modprobe sch_netem || true
          npm run display-load -- --counts 10,30 --no-hung --netem "delay 80ms 20ms loss 3%" --json load-netem.json

      # Справочно: где таймауты по умолчанию перестают хватать (не валит job; цифры — в журнале и артефакте).
      - name: Нагрузка по очень плохой сети — 200±50 мс, потери 10 % (справочно)
        continue-on-error: true
        working-directory: admin-web/server
        env:
          FIRMWARE_HOST_BIN: ${{ github.workspace }}/firmware/display/build/display_host
        run: npm run display-load -- --counts 10,30 --no-hung --netem "delay 200ms 50ms loss 10%" --json load-netem-heavy.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: display-load
          path: admin-web/server/load-*.json

  esp32:
    name: Сборка для CrowPanel 5.79 (ESP32-S3)
    runs-on: ubuntu-latest
    # Одна симуляция Wokwi на токен: второй прогон параллельно (push + ручной запуск той же ветки) рвётся на подключении
    # («Connection to transport closed unexpectedly: code 1006»). Прогоны ждут друг друга, не отменяются.
    concurrency:
      group: wokwi-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # для сравнения с прошлым коммитом: нужна ли самопроверка в Wokwi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
            ~/.cache/esp-emu
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/display/platformio.ini', 'firmware/display/tools/espemu_selftest.sh') }}

      - name: PlatformIO
        run: pip install platformio

      - name: Сборка crowpanel579, crowpanel579-wokwi и crowpanel579-espemu
        working-directory: firmware/display
        run: pio run -e crowpanel579 -e crowpanel579-wokwi -e crowpanel579-espemu

      # Самопроверка изнутри платы в esp-emulator от Espressif (бета, Apache-2.0): без квоты и секретов — на каждом прогоне.
      # Проверяет Wi-Fi, протокол, звук по протоколу без карты, REBOOT и сброс сторожем; microSD и I²S (клип, объявление, MP3)
      # эмулятор не умеет — это остаётся за Wokwi и платой (firmware/display/README.md, «esp-emulator»).
      - name: Самопроверка в esp-emulator
        working-directory: firmware/display
        run: tools/espemu_selftest.sh --no-build

      # Минуты Wokwi ограничены месячной квотой: самопроверка — только когда менялось то, что попадает в плату или в её прогон
      # (код платы и ядра, сборка, схема Wokwi, сам скрипт, этот workflow). Правка сервера или прошивки для ПК её не тратит.
      # Ручной запуск — всегда.
      - name: Нужна ли самопроверка в Wokwi
        id: wokwi_needed
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          board='^(firmware/display/(src/esp32/|lib/|platformio\.ini|wokwi\.toml|diagram\.json|tools/wokwi_selftest\.sh)|\.github/workflows/firmware\.yml)'
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
             || git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE "$board"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Код платы не менялся — самопроверка в Wokwi пропущена (экономия квоты)"
          fi

      # Самопроверка изнутри платы (lib/selftest): протокол, перезагрузка, сброс сторожем. Токен — секрет WOKWI_CLI_TOKEN;
      # без него (форк, секрет не заведён) шаг пропускается с пометкой, а не краснеет. Кончилась месячная квота Wokwi (код 4) —
      # предупреждение «не проверено», а не провал: прошивка при этом не запускалась вовсе. Провал самопроверки — красный, как раньше.
      - name: Самопроверка в эмуляторе Wokwi
        if: steps.wokwi_needed.outputs.run == 'true'
        working-directory: firmware/display
        env:
          WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
          WOKWI_VERSION: v0.27.1
        run: |
          if [ -z "$WOKWI_CLI_TOKEN" ]; then
            echo "::notice::Секрета WOKWI_CLI_TOKEN нет — самопроверка в Wokwi пропущена"
            exit 0
          fi
          mkdir -p ~/.local/bin
          curl -fsSL "https://github.com/wokwi/wokwi-cli/releases/download/$WOKWI_VERSION/wokwi-cli-linuxstatic-x64" -o ~/.local/bin/wokwi-cli
          chmod +x ~/.local/bin/wokwi-cli
          code=0
          PATH=$HOME/.local/bin:$PATH tools/wokwi_selftest.sh --no-build --timeout-ms 180000 --log wokwi-serial.log || code=$?
          if [ "$code" -eq 4 ]; then
            echo "::warning::Wokwi: исчерпана месячная квота CI-минут — самопроверка платы НЕ прогнана (прошивка не проверена в эмуляторе)"
            exit 0
          fi
          exit "$code"

      - name: Журнал Wokwi
        if: always()
        working-directory: firmware/display
        run: '[ -f wokwi-serial.log ] && grep -a "SELFTEST\\|rst:\\|assert\\|Guru\\|task_wdt" wokwi-serial.log || true'

      - name: Размер прошивки
        working-directory: firmware/display
        run: pio run -e crowpanel579 -t size

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-crowpanel579
          path: |
            firmware/display/.pio/build/crowpanel579/firmware.bin
            firmware/display/.pio/build/crowpanel579/bootloader.bin
            firmware/display/.pio/build/crowpanel579/partitions.bin
            firmware/display/.pio/build/crowpanel579-wokwi/firmware.bin
            firmware/display/.pio/build/crowpanel579-wokwi/firmware.elf
            firmware/display/wokwi-serial.log
