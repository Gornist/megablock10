name: E2E на эмуляторах

# Тяжёлый прогон (два эмулятора + сервер дашборда + все сценарии scripts/e2e/scenarios, ≈17 мин): на PR в main, если он трогает
# приложение, kit или стенд, — иначе регрессия видна только ночью (docs/refactor-plan.md, A3); плюс ночью и вручную.
# Запуск вручную: Actions → «E2E на эмуляторах» → Run workflow (или `gh workflow run e2e.yml`).
on:
  pull_request:
    branches: [ main ]
    paths:
      - "app/**"
      - "kit/**"
      - "scripts/e2e/**"
      - ".github/workflows/e2e.yml"
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch: {}

# Новый пуш в тот же PR отменяет недоигранный прогон: результат старого коммита уже никому не нужен, а раннер занят 17 минут.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AVD_A: e2e_a
      AVD_B: e2e_b
      BOOT_TIMEOUT: "600"
      ANDROID_AVD_HOME: /home/runner/.android/avd   # одно место и для avdmanager (создание), и для emulator (запуск) — иначе «Unknown AVD name»
      EMU_EXTRA_ARGS: "-memory 2048 -cores 2 -no-metrics"
      E2E_DIR: /tmp/mb10-e2e
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: gradle/actions/setup-gradle@v6

      - name: KVM для эмуляторов
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Диагностика KVM
        run: |
          ls -l /dev/kvm || true
          nproc; free -m | head -2

      - name: "Android SDK: образ системы и два AVD"
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "emulator" "system-images;android-34;google_apis;x86_64" > /dev/null
          for n in "$AVD_A" "$AVD_B"; do
            echo no | avdmanager create avd -n "$n" -k "system-images;android-34;google_apis;x86_64" -d pixel_6 --force
          done

      - name: Сборка APK
        run: ./gradlew assembleDebug --no-daemon

      - name: "Стенд: сервер, эмуляторы, персонажи"
        run: scripts/e2e/up.sh --no-build

      - name: Сценарии
        run: scripts/e2e/run-all.sh

      - name: Логи и снимки экрана (при падении)
        if: failure()
        timeout-minutes: 3   # adb на незагрузившемся эмуляторе блокируется — без таймаута шаг висел бы до конца job
        run: |
          mkdir -p e2e-artifacts
          cp -r "$E2E_DIR"/*.log "$E2E_DIR"/*.xml "$ANDROID_AVD_HOME"/*.avd/*.log e2e-artifacts/ 2>/dev/null || true
          cp -r "$E2E_DIR"/journals e2e-artifacts/ 2>/dev/null || true   # журналы приложения красных сценариев
          for s in emulator-5554 emulator-5556; do
            timeout 15 "$ANDROID_HOME/platform-tools/adb" -s $s exec-out screencap -p > e2e-artifacts/screen_$s.png 2>/dev/null || true
            timeout 15 "$ANDROID_HOME/platform-tools/adb" -s $s logcat -d > e2e-artifacts/logcat_$s.txt 2>/dev/null || true
          done

      # Артефакты не всем доступны (и не из каждой среды скачиваются) — главное о красных сценариях печатаем прямо в журнал job.
      - name: Журналы красных сценариев (в лог)
        if: failure()
        timeout-minutes: 2
        run: |
          for f in "$E2E_DIR"/journals/*-emulator-*.log; do
            [ -f "$f" ] || continue
            echo "::group::$(basename "$f") — последние 150 строк"
            tail -150 "$f"
            echo "::endgroup::"
          done
          for f in "$E2E_DIR"/journals/*-ui-*.xml; do
            [ -f "$f" ] || continue
            echo "::group::$(basename "$f") — тексты на экране"
            grep -o 'text="[^"]*"' "$f" | grep -v 'text=""' | head -80
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-artifacts
          path: e2e-artifacts
