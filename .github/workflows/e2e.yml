name: E2E на эмуляторах

# Тяжёлый прогон (два эмулятора + сервер дашборда + все сценарии scripts/e2e/scenarios, ≈17 мин): на PR в main, если он трогает
# приложение, kit или стенд, — иначе регрессия видна только ночью (docs/refactor-plan.md, A3); плюс ночью и вручную.
# Запуск вручную: Actions → «E2E на эмуляторах» → Run workflow (или `gh workflow run e2e.yml`).
on:
  pull_request:
    branches: [ main ]
    paths:
      - "app/**"
      - "kit/**"
      - "rules/**"
      - "netrun/**"
      - "netrun-bridge/**"
      - "scripts/e2e/**"
      - ".github/workflows/e2e.yml"
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      static_peers:
        description: "Статические пиры (link.sh: DEBUG_PEER + emu redir) поверх NSD. Снять — только NSD (эмуляторы для NSD плохой свидетель, A4)"
        type: boolean
        default: true

# Новый пуш в тот же PR отменяет недоигранный прогон: результат старого коммита уже никому не нужен, а раннер занят 17 минут.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  e2e:
    # Раннер на devbox (scripts/devbox-runner.sh): SDK, два AVD (Medium_Phone_API_35, Second_API_35 — имена по умолчанию в lib.sh), godot,
    # Node 22 и JDK 21 уже стоят, ставить их не нужно. Форки не запускаем: чужой код не должен идти на машине владельца.
    # Откат на облако: runs-on: ubuntu-latest, убрать условие и вернуть шаги установки Java/Node/Godot/KVM/SDK из истории файла (PR «e2e на раннере devbox»).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, devbox]
    # Очередь замка devbox до 45 мин (stand_lock_acquire в scripts/e2e/lib.sh) + сам прогон.
    timeout-minutes: 90
    env:
      BOOT_TIMEOUT: "300"
      EMU_EXTRA_ARGS: "-memory 2048 -cores 2 -no-metrics"
      E2E_DIR: /tmp/mb10-e2e
      # Сквозной сценарий «Сети» (netrun-run.sh) обязателен: без godot он красный, а не «пропущен» (решение владельца).
      E2E_NETRUN_REQUIRED: "1"
      # На devbox 7777/udp (ENet «Сети») держит игровой сервер для очков: сервер мира e2e не мог открыть порт, бот давал timeout:connect
      # (прогон 37512619892). Свои порты сценариев — вне диапазона стенда очков (7410/7420/7777) и вне друг друга.
      E2E_NETRUN_BRIDGE: "17410"
      E2E_NETRUN_LINE: "17411"
      E2E_NETRUN_ENET: "17777"
      E2E_NRB_BRIDGE: "17414"
      E2E_NRB_LINE: "17415"
      E2E_NRB_ENET: "17778"
      # Строкой, не inputs.static_peers: у ночного и PR-запуска входов нет (null), им — как по умолчанию, со статическими пирами.
      # e2e проверяет логику приложения, а не mDNS эмуляторов (решение владельца 25.09); NSD — JVM-тесты и телефоны.
      E2E_STATIC_PEERS: ${{ github.event.inputs.static_peers == 'false' && '0' || '1' }}
    steps:
      # clean: false — рабочая папка раннера постоянная: сохраняются app/build, netrun/.godot (кеш импорта) и node_modules, иначе каждый прогон
      # собирал бы всё с нуля. Отслеживаемые файлы checkout всё равно приводит к коммиту.
      - uses: actions/checkout@v7
        with:
          clean: false

      # Служба раннера не читает ~/.bashrc: SDK, JDK и godot берём явно (пути как в scripts/devbox-setup.sh).
      - name: Окружение devbox
        run: |
          {
            echo "ANDROID_HOME=$HOME/android-sdk"
            echo "ANDROID_SDK_ROOT=$HOME/android-sdk"
            echo "ANDROID_AVD_HOME=$HOME/.android/avd"
            echo "JAVA_HOME=/usr/lib/jvm/temurin-21-jdk-amd64"
          } >> "$GITHUB_ENV"
          {
            echo "/usr/lib/jvm/temurin-21-jdk-amd64/bin"
            echo "$HOME/android-sdk/platform-tools"
            echo "$HOME/.local/bin"
          } >> "$GITHUB_PATH"
          ls -l /dev/kvm; nproc; free -m | sed -n 2p
          "$HOME/.local/bin/godot" --version
          node --version

      # Зависимости сервера: в постоянной папке up.sh сам их не обновит (npm ci только при отсутствии node_modules).
      - name: Зависимости сервера
        run: cd admin-web/server && npm ci --no-audit --no-fund

      - name: Импорт проекта «Сети» (кеш .godot в рабочей папке)
        run: godot --headless --path netrun --import

      # APK собирает сам up.sh (без --no-build) — уже под замком devbox, чтобы Gradle раннера и Gradle-задачи dbx.sh не шли вместе.
      - name: "Стенд: замок devbox, APK, сервер, эмуляторы, персонажи"
        run: scripts/e2e/up.sh

      - name: Сценарии
        run: scripts/e2e/run-all.sh

      - name: Логи и снимки экрана (при падении)
        if: failure()
        timeout-minutes: 3   # adb на незагрузившемся эмуляторе блокируется — без таймаута шаг висел бы до конца job
        run: |
          mkdir -p e2e-artifacts
          cp -r "$E2E_DIR"/*.log "$E2E_DIR"/*.xml "$ANDROID_AVD_HOME"/*.avd/*.log e2e-artifacts/ 2>/dev/null || true
          cp -r "$E2E_DIR"/journals e2e-artifacts/ 2>/dev/null || true   # журналы приложения красных сценариев
          for s in emulator-5554 emulator-5556; do
            timeout 15 "$ANDROID_HOME/platform-tools/adb" -s $s exec-out screencap -p > e2e-artifacts/screen_$s.png 2>/dev/null || true
            timeout 15 "$ANDROID_HOME/platform-tools/adb" -s $s logcat -d > e2e-artifacts/logcat_$s.txt 2>/dev/null || true
          done

      # Артефакты не всем доступны (и не из каждой среды скачиваются) — главное о красных сценариях печатаем прямо в журнал job.
      - name: Журналы красных сценариев (в лог)
        if: failure()
        timeout-minutes: 2
        run: |
          for f in "$E2E_DIR"/journals/*-emulator-*.log; do
            [ -f "$f" ] || continue
            echo "::group::$(basename "$f") — последние 150 строк"
            tail -150 "$f"
            echo "::endgroup::"
          done
          for f in "$E2E_DIR"/journals/*-ui-*.xml; do
            [ -f "$f" ] || continue
            echo "::group::$(basename "$f") — тексты на экране"
            grep -o 'text="[^"]*"' "$f" | grep -v 'text=""' | head -80
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-artifacts
          path: e2e-artifacts

      # На облаке виртуалка умирала вместе с job; на devbox эмуляторы, сервер и замок очереди остались бы жить (в том числе после отмены job).
      - name: Остановить стенд и снять замок devbox
        if: always()
        timeout-minutes: 3
        run: scripts/e2e/down.sh
