name: APK для телефонов

# APK для раздачи на телефоны площадки: на каждый push в main (артефакт 30 дней), по тегу v* — ещё и GitHub Release; вручную — из любой ветки.
# main.yml тоже кладёт debug-APK артефактом, но его подпись случайна: debug-ключ рождается на каждом раннере заново, и телефон не поставит
# такой APK поверх прежнего (INSTALL_FAILED_UPDATE_INCOMPATIBLE). Здесь APK при наличии ключа подписывается постоянным ключом из секретов Actions,
# имя файла содержит короткий хеш коммита — по нему видно, какая сборка на каком телефоне.
#
# Ключ даёт владелец, в репозитории его нет. Секреты Actions (все четыре или ни одного):
#   ANDROID_KEYSTORE_BASE64    — `base64 -i keystore.jks` (JKS или PKCS12)
#   ANDROID_KEYSTORE_PASSWORD  — пароль хранилища
#   ANDROID_KEY_ALIAS          — псевдоним ключа
#   ANDROID_KEY_PASSWORD       — пароль ключа
# Без секретов сборка идёт с debug-ключом раннера, в сводке job об этом сказано. Подписывается заново собранный debug-APK (apksigner),
# Gradle не меняется: приложение остаётся debuggable, как у всех сборок на телефонах, а правки app/build.gradle.kts не нужны.
# Первый переход на постоянный ключ требует удалить приложение с телефона один раз (подпись другая); данные игрока при этом стираются.
on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # GitHub Release по тегу (в остальных запусках не используется)
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"   # как в main.yml

      - uses: gradle/actions/setup-gradle@v6

      - name: Сборка debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Подпись постоянным ключом и имя по коммиту
        id: sign
        run: |
          set -euo pipefail
          SHORT=$(git rev-parse --short=8 HEAD)
          SRC=app/build/outputs/apk/debug/app-debug.apk
          OUT="megablok10-$SHORT.apk"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
            "$APKSIGNER" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
              --out "$OUT" "$SRC"
            CERTS=$("$APKSIGNER" verify --print-certs "$OUT")   # без конвейера: grep -m1 под pipefail оборвал бы apksigner по SIGPIPE
            echo "$CERTS" | grep -m1 "SHA-256"
            rm -f "$RUNNER_TEMP/release.jks"
            echo "signed=постоянный ключ из секретов" >> "$GITHUB_OUTPUT"
            echo "### APK $OUT — подписан постоянным ключом (ставится поверх прежнего)" >> "$GITHUB_STEP_SUMMARY"
          else
            cp "$SRC" "$OUT"
            echo "signed=debug-ключ раннера (случайный)" >> "$GITHUB_OUTPUT"
            {
              echo "### APK $OUT — debug-ключ раннера"
              echo "Секреты ANDROID_KEYSTORE_* не заданы: подпись случайная, поверх уже поставленного приложения такой APK не встанет."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          sha256sum "$OUT" | tee "$OUT.sha256"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

      - name: Артефакт
        uses: actions/upload-artifact@v7
        with:
          name: megablok10-apk
          path: |
            ${{ steps.sign.outputs.apk }}
            ${{ steps.sign.outputs.apk }}.sha256
          retention-days: 30

      - name: GitHub Release (только по тегу v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "${{ steps.sign.outputs.apk }}" "${{ steps.sign.outputs.apk }}.sha256" \
            --title "${{ github.ref_name }}" --notes "Подпись: ${{ steps.sign.outputs.signed }}. Коммит $GITHUB_SHA."
